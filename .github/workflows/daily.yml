# Runs the model every weekday and saves the prediction for the website.
name: Daily prediction

on:
  schedule:
    - cron: "20 2 * * 1-5"     # 7:50 AM IST: predict today (before NSE opens at 9:15)
    - cron: "30 10 * * 1-5"    # 4:00 PM IST: write the real result next to the prediction
  workflow_dispatch:           # also allows a manual run from the Actions tab

permissions:
  contents: write              # the job saves site/data/live.json back to the repo

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: live/requirements.txt
      - run: pip install -r live/requirements.txt
      - run: python live/predict_today.py
      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/live.json
          git diff --cached --quiet || (git commit -m "Daily prediction update" && git push)
